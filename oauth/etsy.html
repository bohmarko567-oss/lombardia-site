<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Etsy sign-in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3ee; color: #1d1d1b; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: 0; color: #555; }
</style>
</head>
<body>
<main>
  <h1 id="h">Etsy sign-in</h1>
  <p id="m">This page only receives the Etsy sign-in for the Lombardia Automobili listing tool. You can close it.</p>
</main>
<script>
  // No third-party scripts. The code stays in the address bar for the listing tool on the owner's computer; nothing is sent anywhere.
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get("error")) { document.getElementById("h").textContent = "Sign-in not completed"; document.getElementById("m").textContent = "Etsy said: " + q.get("error"); }
    else if (q.get("code")) { document.getElementById("h").textContent = "Signed in"; document.getElementById("m").textContent = "Etsy sign-in finished. The listing tool takes it from here - you can close this tab."; }
  })();
</script>
</body>
</html>
